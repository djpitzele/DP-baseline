pipeline_name: dp_joints_image
env_name: joints-image-v0
abs_action: false
dataset_path: data/joints_50demos_replay.zarr
mode: train
# Single-cam: ['img', 'action']. Dual-cam (scene + wrist): ['img_cam0', 'img_cam1', 'action']
obs_keys: ['img_cam0', 'img_cam1', 'action']
# Input image shape (from zarr/dataset before condition resize/crop)
shape_meta:
  obs:
    image_cam0:
      shape: [3, 256, 256]
      type: rgb
    image_cam1:
      shape: [3, 256, 256]
      type: rgb
action_dim: 8
obs_steps: 2
action_steps: 8
# Image augmentations (applied to all RGB obs). Add more dicts to extend.
# Each dict: name + kwargs. Supported: color_jitter, random_grayscale.
image_augmentations:
  - name: color_jitter
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.1
# obs_encoder (input images resized/cropped to match)
rgb_model: resnet18
resize_shape: [256, 256]
crop_shape: [84, 84]
random_crop: true
use_group_norm: true
use_seq: true
# train
device: cuda:0
seed: 0
gradient_steps: 1000000
batch_size: 32
horizon: 16
nn: dit
diffusion: ddpm
sample_steps: 5
lr: 0.0001
model_path: path/to/model
num_workers: 4
eval_freq: 100000
save_freq: 100000
# log
exp_name: joints_${nn}_${diffusion}_horizon_${horizon}
save_path: logs
project: CleanDiffuser
group: dp_joints
wandb_mode: offline
log_freq: 500
work_dir: ${save_path}/${pipeline_name}/${mode}/${env_name}/${exp_name}_${now:%Y%m%d_%H%M%S}/${seed}
hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false
